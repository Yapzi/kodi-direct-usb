          cp kodi/directusb/libusb-COPYING output/
          git -C kodi diff --binary > output/kodi-source-changes.patch
          tar -czf output/directusb-new-sources.tar.gz -C kodi \
            directusb/UsbPcmMath.h directusb/UsbPcmMathTest.cpp \
            directusb/make_test_wavs.py directusb/MainAddition.java.txt directusb/apply_overlay.py \
            xbmc/cores/AudioEngine/Sinks/AESinkUSBDirect.cpp \
            xbmc/cores/AudioEngine/Sinks/AESinkUSBDirect.h \
            tools/android/packaging/xbmc/src/UsbDirectProbe.java.in
          cp "$RUNNER_TEMP/libusb-1.0.27.tar.bz2" output/
          printf '%s\n' 'Kodi base: https://github.com/Maven85/kodi/tree/e00e52ee98f05b241d55aa9aff25e08130cac04f' 'RC1 is an experimental build; not yet hardware validated.' > output/source-info.txt
          sha256sum output/Maven-20.5-DirectUSB-RC1.apk > output/apk.sha256
      - name: Upload APK and verification files
        uses: actions/upload-artifact@v4
        with:
          name: Maven-20.5-DirectUSB-RC1
          path: output/
          if-no-files-found: error
          
