name: Maven 20.5 Direct USB ARMv7 RC1
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout pinned Maven 20.5
        uses: actions/checkout@v5
        with:
          repository: Maven85/kodi
          ref: e00e52ee98f05b241d55aa9aff25e08130cac04f
          path: kodi
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool bison flex \
            build-essential curl gawk gperf \
            lib32stdc++6 lib32z1 lib32z1-dev \
            libcurl4-openssl-dev unzip zip \
            zlib1g-dev pkg-config gettext \
            nasm yasm ccache python3 cmake
          sdkmanager --install \
            "platforms;android-33" \
            "build-tools;30.0.3" \
            "ndk;21.4.7075529"
      - name: Configure independent package
        working-directory: kodi
        run: |
          sed -i 's/^APP_PACKAGE .*/APP_PACKAGE org.xbmc.kodi.directusb/' version.txt
          sed -i 's/>@APP_NAME@</>Kodi Direct USB</g' tools/android/packaging/xbmc/strings.xml.in
          cat version.txt
      - name: Generate debug signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Configure ARMv7
        working-directory: kodi/tools/depends
        run: |
          test -f "$ANDROID_HOME/platforms/android-33/android.jar"
          test -f "$ANDROID_HOME/ndk/21.4.7075529/source.properties"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('configure.ac')
          s = p.read_text()
          old = 'if [ ! test -f $use_sdk_path/tools/bin/sdkmanager ]; then'
          new = 'if ! command -v sdkmanager >/dev/null 2>&1; then'
          assert s.count(old) == 1
          p.write_text(s.replace(old, new, 1))
          PY
          ./bootstrap
          ./configure \
            --host=arm-linux-androideabi \
            --with-sdk-path="$ANDROID_HOME" \
            --with-ndk-path="$ANDROID_HOME/ndk/21.4.7075529" \
            --with-ndk-api=21 \
            --with-tarballs="$HOME/kodi-tarballs" \
            --prefix="$HOME/kodi-depends" \
            --enable-debug=no
      - name: Restore dependency cache
        uses: actions/cache/restore@v4
        id: dep-cache
        with:
          path: ~/kodi-depends
          key: maven205-e00e52ee-armv7-ndk21e-ubuntu2204-v1
      - name: Build dependencies
        working-directory: kodi/tools/depends
        if: steps.dep-cache.outputs.cache-hit != 'true'
        run: |
          make -j2
          df -h
      - name: Save dependency cache
        uses: actions/cache/save@v4
        if: steps.dep-cache.outputs.cache-hit != 'true'
        with:
          path: ~/kodi-depends
          key: maven205-e00e52ee-armv7-ndk21e-ubuntu2204-v1
      - name: Write RC1 sources (part 10)
        working-directory: kodi
        run: |
          mkdir -p directusb
          cat > directusb/UsbPcmMath.h <<'RC1_SOURCE_0_0_EOF'
          #pragma once
          #include <cstdint>

          namespace directusb
          {
          constexpr uint32_t Nominal(unsigned rate)
          {
            return static_cast<uint32_t>((uint64_t(rate) * 65536 + 4000) / 8000);
          }
          inline unsigned NextFrames(uint32_t& phase, uint32_t step)
          {
            phase += step;
            unsigned frames = phase >> 16;
            phase &= 0xffff;
            return frames;
          }
          inline void Pack24(const uint8_t* src, uint8_t* dst)
          {
            // AE_FMT_S24NE4MSB and UAC2 Type-I 24-in-32 are both left aligned.
            dst[0] = 0; dst[1] = src[1]; dst[2] = src[2]; dst[3] = src[3];
          }
          constexpr unsigned PatternFrames = 2048;
          inline int32_t TestSample(unsigned frame, unsigned channel)
          {
            uint32_t v = (frame * 2u + channel + 1u) * 0x9e3779b1u;
            v ^= v >> 16; v *= 0x85ebca6bu; v ^= v >> 13;
            return int32_t(v & 0xffffu) - 32768;
          }
          inline bool FeedbackValid(uint32_t value, uint32_t nominal)
          {
            return value >= nominal * 98 / 100 && value <= nominal * 102 / 100;
          }
          inline uint32_t ReadLE32(const uint8_t* p)
          {
            return uint32_t(p[0]) | (uint32_t(p[1]) << 8) |
                   (uint32_t(p[2]) << 16) | (uint32_t(p[3]) << 24);
          }
          inline bool PatternFrame(const uint8_t* frame, unsigned index)
          {
            return ReadLE32(frame) == (uint32_t(TestSample(index, 0)) << 8) &&
                   ReadLE32(frame+4) == (uint32_t(TestSample(index, 1)) << 8);
          }
          }
          RC1_SOURCE_0_0_EOF

          cat > directusb/UsbPcmMathTest.cpp <<'RC1_SOURCE_1_0_EOF'
          #include <initializer_list>
          #include "UsbPcmMath.h"
          #include <cassert>
          #include <cmath>
          #include <cstdio>
          #include <cstring>
          int main(int argc,char** argv){
            for(unsigned rate: {44100u,48000u,88200u,96000u,176400u,192000u}){
              uint32_t phase=0; unsigned sum=0;
              for(int i=0;i<8000;++i){unsigned n=directusb::NextFrames(phase,directusb::Nominal(rate)); assert(n*8<=776); sum+=n;}
              assert(std::abs(int(sum)-int(rate))<=1);
            }
            uint8_t input[]={0xA5,0x37,0x21,0x80},out[4]{};
            directusb::Pack24(input,out); assert(out[0]==0 && out[1]==0x37 && out[2]==0x21 && out[3]==0x80);
            assert(directusb::FeedbackValid(361264,361267)); assert(!directusb::FeedbackValid(0,361267));
            for(int a=1;a<argc;++a){
              FILE* f=std::fopen(argv[a],"rb"); assert(f);
              unsigned char header[44]; assert(std::fread(header,1,44,f)==44);
              assert(!std::memcmp(header,"RIFF",4) && !std::memcmp(header+36,"data",4));
              for(unsigned i=0;i<directusb::PatternFrames;++i){
                uint8_t raw[6],frame[8]{}; assert(std::fread(raw,1,6,f)==6);
                std::memcpy(frame+1,raw,3);std::memcpy(frame+5,raw+3,3);
                assert(directusb::PatternFrame(frame,i));
              }
              std::fclose(f);
            }
            std::puts("PASS: all six packet rates, PCM packing, feedback bounds and WAV pattern");
          }
          RC1_SOURCE_1_0_EOF

          cat > directusb/make_test_wavs.py <<'RC1_SOURCE_2_0_EOF'
          """Low-level (about -48 dBFS peak) deterministic stereo 24-bit test WAVs."""
          import sys, wave
          from pathlib import Path

          def sample(frame, channel):
              v=((frame*2+channel+1)*0x9e3779b1)&0xffffffff
              v ^= v>>16
              v=(v*0x85ebca6b)&0xffffffff
              v ^= v>>13
              return (v&0xffff)-32768

          out=Path(sys.argv[1]); out.mkdir(parents=True,exist_ok=True)
          block=b''.join((sample(i,c)&0xffffff).to_bytes(3,'little') for i in range(2048) for c in range(2))
          for rate in (44100,96000,192000):
              # Several identical blocks to allow the player to finish priming its buffers.
              with wave.open(str(out/f'Exact24-{rate}.wav'),'wb') as f:
                  f.setnchannels(2); f.setsampwidth(3); f.setframerate(rate)
                  n=rate*2
                  f.writeframes((block*((n+2047)//2048))[:n*6])
          RC1_SOURCE_2_0_EOF

          cat > directusb/MainAddition.java.txt <<'RC1_SOURCE_3_0_EOF'

            public static android.hardware.usb.UsbDevice directUsbFind(android.content.Context context)
            {
              android.hardware.usb.UsbManager manager = (android.hardware.usb.UsbManager)
                  context.getSystemService(android.content.Context.USB_SERVICE);
              if (manager == null) return null;
              for (android.hardware.usb.UsbDevice d : manager.getDeviceList().values())
                if (d.getVendorId() == 0x152a && d.getProductId() == 0x8750) return d;
              return null;
            }

            public int directUsbPresent()
            {
              try { return directUsbFind(this) != null ? 1 : 0; }
              catch (Exception e) { Log.e("KodiDirectUSB", "USB enumeration failed", e); return 0; }
            }

            public int directUsbOpen()
            {
              android.hardware.usb.UsbDeviceConnection connection = null;
              try
              {
                android.hardware.usb.UsbManager manager = (android.hardware.usb.UsbManager)
                    getSystemService(USB_SERVICE);
                android.hardware.usb.UsbDevice device = directUsbFind(this);
                if (manager == null || device == null) return -1;
                if (!manager.hasPermission(device))
                {
                  Log.e("KodiDirectUSB", "M345_PERMISSION_REQUIRED: open UsbDirectProbe and grant USB access");
                  return -1;
                }
                connection = manager.openDevice(device);
                if (connection == null) return -1;
                android.os.ParcelFileDescriptor duplicate = android.os.ParcelFileDescriptor.fromFd(
                    connection.getFileDescriptor());
                int fd = duplicate.detachFd();
                Log.i("KodiDirectUSB", "M345_JNI_OPEN: fd=" + fd);
                return fd;
              }
              catch (Exception e)
              { Log.e("KodiDirectUSB", "USB open failed", e); return -1; }
              finally { if (connection != null) connection.close(); }
            }
          RC1_SOURCE_3_0_EOF

          cat > tools/android/packaging/xbmc/src/UsbDirectProbe.java.in <<'RC1_SOURCE_4_0_EOF'
          package @APP_PACKAGE@;

          import android.app.Activity;
          import android.app.PendingIntent;
          import android.content.*;
          import android.hardware.usb.*;
          import android.os.Build;
          import android.os.Bundle;
          import android.util.Log;
          import android.widget.*;
          import java.util.UUID;

          public class UsbDirectProbe extends Activity
          {
            private TextView status;
            private String action;
            private boolean registered;
            private final BroadcastReceiver receiver = new BroadcastReceiver()
            {
              @Override public void onReceive(Context c, Intent i)
              { if (action.equals(i.getAction())) check(false); }
            };
            @Override public void onCreate(Bundle state)
            {
              super.onCreate(state);
              action = getPackageName() + ".USB_PERMISSION." + UUID.randomUUID().toString();
              LinearLayout layout = new LinearLayout(this);
              layout.setOrientation(LinearLayout.VERTICAL);
              layout.setPadding(40,40,40,40);
              status = new TextView(this); status.setTextSize(24); layout.addView(status);
              Button retry = new Button(this); retry.setText("Authorize USB DAC");
              retry.setOnClickListener(v -> check(true)); layout.addView(retry);
              Button close = new Button(this); close.setText("Close");
              close.setOnClickListener(v -> finish()); layout.addView(close);
              setContentView(layout); retry.requestFocus();
              IntentFilter filter = new IntentFilter(action);
              if (Build.VERSION.SDK_INT >= 33) registerReceiver(receiver,filter,Context.RECEIVER_NOT_EXPORTED);
              else registerReceiver(receiver,filter);
              registered=true; check(true);
            }
            private void check(boolean request)
            {
              try
              {
                UsbManager manager=(UsbManager)getSystemService(USB_SERVICE);
                UsbDevice device=Main.directUsbFind(this);
                if (manager==null || device==null) {status.setText("DX3 Pro+ not found");return;}
                if (manager.hasPermission(device))
                {
                  status.setText("DX3 Pro+\nUSB permission granted\nClose this screen and select Direct USB in Kodi.");
                  Log.i("KodiDirectUSB","M345_PERMISSION_GRANTED");return;
                }
                status.setText("USB permission required (retry if denied)");
                if (request)
                {
                  PendingIntent pi=PendingIntent.getBroadcast(this,0,new Intent(action).setPackage(getPackageName()),
                      PendingIntent.FLAG_IMMUTABLE|PendingIntent.FLAG_ONE_SHOT);
                  manager.requestPermission(device,pi);
                }
              }
              catch (Exception e) {status.setText(e.toString());Log.e("KodiDirectUSB","Authorization failed",e);}
            }
            @Override public void onDestroy()
            {if(registered) unregisterReceiver(receiver);super.onDestroy();}
          }
          RC1_SOURCE_4_0_EOF
      - name: Write RC1 sources (part 11)
        working-directory: kodi
        run: |
          cat > xbmc/cores/AudioEngine/Sinks/AESinkUSBDirect.cpp <<'RC1_SOURCE_5_0_EOF'
          /* SPDX-License-Identifier: GPL-2.0-or-later */
          #include "AESinkUSBDirect.h"
          #include "cores/AudioEngine/Interfaces/AESink.h"
          #include "cores/AudioEngine/AESinkFactory.h"
          #include "cores/AudioEngine/Utils/AEDeviceInfo.h"
          #include "platform/android/activity/XBMCApp.h"
          #include "UsbPcmMath.h"
          #include <androidjni/JNIThreading.h>
          #include <android/log.h>
          #include <jni.h>
          #include <libusb.h>
          #include <unistd.h>
          #include <algorithm>
          #include <array>
          #include <atomic>
          #include <chrono>
          #include <condition_variable>
          #include <cstdint>
          #include <cstring>
          #include <limits>
          #include <map>
          #include <mutex>
          #include <thread>
          #include <vector>

          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, "KodiDirectUSB", __VA_ARGS__)
          #define LOGE(...) __android_log_print(ANDROID_LOG_ERROR, "KodiDirectUSB", __VA_ARGS__)
          using namespace jni;
          using namespace std::chrono_literals;
          namespace
          {
          using Clock = std::chrono::steady_clock;
          constexpr uint16_t VID=0x152a, PID=0x8750;
          constexpr int AC=0, AS=1, ALT=2;
          constexpr uint8_t CLOCK_ID=0x29, EP_OUT=0x01, EP_FB=0x81;
          constexpr int PACKETS=8, DATA_SLOTS=8, FB_SLOTS=2;
          constexpr unsigned FRAME_BYTES=8;
          constexpr unsigned RING_MS=80;
          constexpr unsigned ERROR_RETURN=std::numeric_limits<unsigned>::max();
          const std::vector<unsigned> RATES{44100,48000,88200,96000,176400,192000};

          int JavaCall(const char* method)
          {
            JNIEnv* env=xbmc_jnienv();
            if (!env) return -1;
            auto* activity=CXBMCApp::Get().GetDirectUsbActivity();
            if (!activity || !activity->clazz) return -1;
            jobject obj=activity->clazz;
            jclass cls=env->GetObjectClass(obj);
            if (!cls) { env->ExceptionClear(); return -1; }
            jmethodID id=env->GetMethodID(cls,method,"()I");
            if (!id) { env->ExceptionClear(); env->DeleteLocalRef(cls); return -1; }
            int result=env->CallIntMethod(obj,id);
            if (env->ExceptionCheck()) { env->ExceptionClear(); result=-1; }
            env->DeleteLocalRef(cls);
            return result;
          }

          class DirectSink final : public IAESink
          {
            struct Slot
            {
              DirectSink* owner=nullptr;
              libusb_transfer* transfer=nullptr;
              std::vector<uint8_t> buffer;
              bool feedback=false, active=false;
              unsigned realFrames=0;
              uint64_t wireStart=0, wireEnd=0;
            };
          public:
            ~DirectSink() override { Deinitialize(); }
            const char* GetName() override { return "USBDIRECT"; }

            bool Initialize(AEAudioFormat& format, std::string& device) override
            {
              if (format.m_dataFormat==AE_FMT_RAW) return false;
              unsigned requested=format.m_sampleRate;
              m_rate=requested;
              if (std::find(RATES.begin(),RATES.end(),m_rate)==RATES.end())
              {
                // Kodi must convert unsupported rates; explicitly report this fact.
                m_rate=48000;
                LOGI("M345_RATE_CONVERSION_REQUIRED: requested=%u chosen=%u",requested,m_rate);
              }
              LOGI("M345_REQUEST: rate=%u format=%s channels=%u",requested,
                   CAEUtil::DataFormatToStr(format.m_dataFormat),format.m_channelLayout.Count());
              m_fd=JavaCall("directUsbOpen");
              if (m_fd<0) return Fail("USB permission/open",m_fd);
              int rc=libusb_set_option(nullptr,LIBUSB_OPTION_NO_DEVICE_DISCOVERY);
              if (rc!=0) return Fail("libusb option",rc);
              rc=libusb_init(&m_context);
              if (rc!=0) return Fail("libusb_init",rc);
              rc=libusb_wrap_sys_device(m_context,intptr_t(m_fd),&m_handle);
              if (rc!=0) return Fail("wrap USB fd",rc);
              if (!CheckDescriptors()) return Fail("unsupported USB descriptors",-1);
              rc=libusb_set_auto_detach_kernel_driver(m_handle,1);
              if (rc!=0) return Fail("auto detach",rc);
              rc=libusb_claim_interface(m_handle,AC);
              if (rc!=0) return Fail("claim AC",rc);
              m_acClaimed=true;
              rc=libusb_claim_interface(m_handle,AS);
              if (rc!=0) return Fail("claim AS",rc);
              m_asClaimed=true;
              rc=libusb_set_interface_alt_setting(m_handle,AS,0);
              if (rc!=0) return Fail("alt 0",rc);
              if (!SetClock(m_rate)) return Fail("clock SET_CUR",-1);
              rc=libusb_set_interface_alt_setting(m_handle,AS,ALT);
              if (rc!=0) return Fail("alt 2",rc);
              bool clockOK=false;
              for (int i=0;i<10;++i)
              {
                if (ReadClock()==m_rate) { clockOK=true; break; }
                std::this_thread::sleep_for(30ms);
              }
              if (!clockOK) return Fail("clock mismatch",-1);
              format.m_sampleRate=m_rate;
              format.m_dataFormat=AE_FMT_S24NE4MSB;
              format.m_channelLayout=AE_CH_LAYOUT_2_0;
              format.m_frameSize=FRAME_BYTES;
              format.m_frames=m_rate/100;
              device="DX3PROPLUS";
              m_capacity=m_rate*RING_MS/1000;
              m_ring.assign(size_t(m_capacity)*FRAME_BYTES,0);
              m_read=m_write=m_count=m_queuedReal=0;
              m_submitted=m_completed=m_lastRealEnd=0;
              m_completedRanges.clear();
              m_patternIndex=0; m_patternLogged=false;
              m_accepted=m_realCompleted=m_padding=m_discarded=0;
              m_low24Nonzero=m_removedPaddingBits=m_nonzeroSamples=0;
              m_goodFeedback=m_badFeedback=m_isoErrors=0;
              m_nominal=directusb::Nominal(m_rate);
              m_step=m_nominal; m_phase=0;
              m_lastFeedback=Clock::now(); m_lastReport=m_lastFeedback;
              m_feedbackReady.store(false);
              m_loggedPCM=false;
              for (size_t i=0;i<m_slots.size();++i)
              {
                auto& slot=m_slots[i];
                slot.owner=this; slot.feedback=i>=DATA_SLOTS;
                slot.active=false; slot.realFrames=0; slot.wireEnd=0;
                slot.buffer.resize(PACKETS*(slot.feedback?4:m_maxPacket));
                slot.transfer=libusb_alloc_transfer(PACKETS);
                if (!slot.transfer) return Fail("alloc transfer",-1);
                libusb_fill_iso_transfer(slot.transfer,m_handle,
                    slot.feedback?EP_FB:EP_OUT,slot.buffer.data(),int(slot.buffer.size()),
                    PACKETS,&DirectSink::Callback,&slot,1000);
              }
              m_run.store(true);
              for (auto& slot:m_slots)
              {
                if (!Submit(slot))
                { m_run.store(false); return Fail("start transfers",-1); }
              }
              try { m_worker=std::thread(&DirectSink::EventLoop,this); }
              catch (...) { m_run.store(false); return Fail("event thread",-1); }
              // Do not declare a high-fidelity connection if feedback never arrives.
              {
                std::unique_lock<std::mutex> lock(m_mutex);
                m_cv.wait_for(lock,750ms,[this]{return m_feedbackReady.load() || !m_run.load();});
              }
              if (!m_run.load() || !m_feedbackReady.load())
              { m_run.store(false); return Fail("no valid feedback at startup",-1); }
              LOGI("M345_READY: rate=%u bits=24 subslot=4 channels=2 ring_ms=%u clock_verified=1",m_rate,RING_MS);
              return true;
            }

            void Deinitialize() override
            {
              m_run.store(false); m_cv.notify_all();
              if (m_worker.joinable()) m_worker.join();
              else if (m_inFlight>0 && m_context) EventLoop();
              if (m_fd>=0) Stats("M345_FINAL");
              // A submitted transfer is freed only after its completion/cancel callback.
              for (auto& slot:m_slots)
              {
                if (slot.transfer) { libusb_free_transfer(slot.transfer); slot.transfer=nullptr; }
                slot.buffer.clear(); slot.active=false;
              }
              if (m_handle)
              {
                if (m_asClaimed)
                {
                  int alt=libusb_set_interface_alt_setting(m_handle,AS,0);
                  int rel=libusb_release_interface(m_handle,AS);
                  LOGI("M345_RELEASE_AS: alt=%d release=%d",alt,rel);
                }
                if (m_acClaimed)
                {
                  int rel=libusb_release_interface(m_handle,AC);
                  LOGI("M345_RELEASE_AC: release=%d",rel);
                }
                // Auto-detach normally restores the kernel driver on release. Retry only
                // if the interface is still unbound. BUSY alone does not prove failure.
                RestoreDriver(AC,m_acClaimed); RestoreDriver(AS,m_asClaimed);
                libusb_close(m_handle); m_handle=nullptr;
              }
              if (m_context) { libusb_exit(m_context); m_context=nullptr; }
              if (m_fd>=0) { close(m_fd); m_fd=-1; LOGI("M345_RELEASE: USB fd closed"); }
              m_acClaimed=m_asClaimed=false;
              m_ring.clear();
            }

            double GetCacheTotal() override
            { return m_rate ? double(m_capacity)/m_rate+0.008 : 0.0; }
            // USB completion is not an analogue presentation timestamp. Report queue
            // delay via GetDelay; leave unknown DAC-internal latency to Kodi's AV offset.
            double GetLatency() override { return 0.0; }
            void GetDelay(AEDelayStatus& status) override
            {
              std::lock_guard<std::mutex> lock(m_mutex);
              if (!m_run.load() || !m_rate) { status.SetDelay(0.0); return; }
              uint64_t target=m_count ? m_submitted+uint64_t(m_count) : m_lastRealEnd;
              uint64_t pending=target>m_completed ? target-m_completed : 0;
              status.SetDelay(double(pending)/m_rate);
            }

            unsigned AddPackets(uint8_t** data,unsigned frames,unsigned offset) override
            {
              if (!m_run.load()) return ERROR_RETURN;
              if (!data || !data[0] || !frames) return 0;
              std::unique_lock<std::mutex> lock(m_mutex);
              m_cv.wait_for(lock,30ms,[this]{return !m_run.load() || m_count<m_capacity;});
              if (!m_run.load()) return ERROR_RETURN;
              unsigned accepted=std::min(frames,m_capacity-m_count);
              const uint8_t* src=data[0]+size_t(offset)*FRAME_BYTES;
              for (unsigned i=0;i<accepted;++i)
              {
                uint8_t* dst=m_ring.data()+size_t(m_write)*FRAME_BYTES;
                const uint8_t* s=src+size_t(i)*FRAME_BYTES;
                for (int ch=0;ch<2;++ch)
                {
                  const uint8_t* sample=s+ch*4;
                  m_low24Nonzero+=sample[1]!=0;
                  m_removedPaddingBits+=sample[0]!=0;
                  m_nonzeroSamples+=(sample[1]|sample[2]|sample[3])!=0;
                  directusb::Pack24(sample,dst+ch*4);
                }
                m_write=(m_write+1)%m_capacity;
              }
              m_count+=accepted; m_accepted+=accepted;
              if (accepted && !m_loggedPCM)
              { m_loggedPCM=true; LOGI("M345_PCM: accepted=%u rate=%u",accepted,m_rate); }
              return accepted;
            }

            void Drain() override
            {
